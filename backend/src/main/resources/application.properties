spring.application.name=smart-academic-system
server.port=${PORT:8080}

# =====================================================
# Database Configuration (MySQL 8 - Aiven)
# =====================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_academic_db?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# JPA / Hibernate
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =====================================================
# Security & Session Management (HTTP-Only Cookie)
# =====================================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=ACADEMIC_SESSION_ID
server.servlet.session.timeout=1d

# =====================================================
# CORS Configuration
# =====================================================
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://sakshitha-academic-portal.netlify.app

# =====================================================
# Early-Warning Rule-Based Thresholds
# HIGH RISK: attendance < 75% OR marks < 40%
# MEDIUM RISK: attendance < 85% OR marks < 60%
# LOW RISK: otherwise
# =====================================================
app.thresholds.high-risk-attendance=75.0
app.thresholds.high-risk-marks=40.0
app.thresholds.medium-risk-attendance=85.0
app.thresholds.medium-risk-marks=60.0